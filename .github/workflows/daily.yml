name: 每日 live.json 生成

on:
  schedule:
    # 北京时间 08:05 / 08:20 / 08:35 = UTC 00:05 / 00:20 / 00:35
    # 三档冗余：GitHub 定时为 best-effort，偶发跳过，多档互备避免整日漏跑
    - cron: '5 0 * * *'
    - cron: '20 0 * * *'
    - cron: '35 0 * * *'
  workflow_dispatch: {}      # 支持手动触发（兜底/首启验证）

permissions:
  contents: write
  models: read

concurrency:
  group: daily-live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成 live.json（免费接口 + GitHub Models 免费模型）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODEL: ${{ vars.GH_MODEL || 'gpt-4o-mini' }}
        run: python app/gen_live.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/live.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "daily: live.json ${{ github.run_id }}"
            git push
            echo "PUSHED"
          fi
