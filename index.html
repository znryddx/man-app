<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F3EC" />
  <title>这男人有点东西</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.cn" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30">
            <rect x="3" y="3" width="26" height="26" rx="8" fill="none" stroke="#2E3A4E" stroke-width="2"/>
            <circle cx="16" cy="16" r="4.2" fill="#3A4A3F"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">这男人有点东西</div>
          <div class="brand-sub">每日东方美学工作台</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="statusbar" id="statusbar"></div>
      <div class="install-hint" id="installHint">
        <button class="install-hint-btn" id="installHintBtn">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
            <path d="M10 3v9m0 0l-3-3m3 3l3-3M5 15h10" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          装到桌面 · 当 App 用
        </button>
        <div class="install-hint-tip">点上方按钮下载安装包（app.apk），下载完成后点击安装，桌面即出现 App 图标。</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-block">
          <h1 class="h1" id="pageTitle">今日总览</h1>
          <div class="sub" id="topsub"></div>
        </div>
        <div class="topbar-actions">
          <div class="searchbox">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
              <circle cx="9" cy="9" r="6" fill="none" stroke="#9A9183" stroke-width="1.6"/>
              <line x1="13.5" y1="13.5" x2="18" y2="18" stroke="#9A9183" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span>搜索今日灵感</span>
          </div>
          <button class="install-btn" id="installBtn">
            <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
              <path d="M10 3v9m0 0l-3-3m3 3l3-3M5 15h10" stroke="#2E3A4E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            安装到桌面
          </button>
          <button class="gen-btn" id="genBtn">
            <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
              <path d="M10 3v14M3 10h14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
            </svg>
            一键生成今日内容
          </button>
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="install-help" id="installHelp" hidden>
    <div class="install-help-card">
      <button class="install-help-close" id="installHelpClose" aria-label="关闭">×</button>
      <h3>装到桌面 · 两步搞定</h3>
      <div class="ih-step"><b>第一步：下载安装包</b><br><a class="ih-dl" href="./app.apk" download>点这里下载 App 安装包（app.apk，不到 1MB）</a></div>
      <div class="ih-step"><b>第二步：安装</b><br>下载完成后点击打开该文件 → 如果手机提示「不允许安装未知应用」，点<b>设置 → 允许此来源</b> → 返回点「<b>安装</b>」→ 完成后桌面出现「有点东西」图标。</div>
      <img class="ih-qr" id="ihQr" alt="App 二维码" />
      <div class="ih-note">装好后点桌面图标即打开 App，内容每天自动更新，永远不用重装。</div>
    </div>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
